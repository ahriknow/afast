name: Deploy docs to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache mdbook
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ runner.os }}

      - name: Install mdbook
        run: |
          if [ ! -x "$HOME/.cargo/bin/mdbook" ]; then
            cargo install mdbook
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build English docs
        run: mdbook build docs/en

      - name: Build Chinese docs
        run: mdbook build docs/zh

      - name: Merge into single site
        run: |
          mkdir -p site/en site/zh
          cp -r docs/en/book/* site/en/
          cp -r docs/zh/book/* site/zh/
          cp docs/index.html site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
