name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag version matches workspace version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          WORKSPACE_VERSION=$(sed -n '/\[workspace\.package\]/,/\[/ s/.*version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "Tag version:     $TAG_VERSION"
          echo "Workspace version: $WORKSPACE_VERSION"
          if [ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]; then
            echo "::error::Tag version 'v$TAG_VERSION' does not match workspace.package version '$WORKSPACE_VERSION'. Aborting publish."
            exit 1
          fi
          echo "::notice::Version check passed: v$TAG_VERSION == $WORKSPACE_VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish afast-macros
        run: cargo publish -p afast-macros --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for afast-macros to be available
        run: sleep 30

      - name: Publish afast
        run: cargo publish -p afast --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
